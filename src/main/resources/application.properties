spring.application.name=rachaconta-api

# BANCO DE DADOS
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/rachacontaapi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true

# JWT (com valores padrão para não quebrar no Render)
jwt.secret=${JWT_SECRET:dev-secret-key-minimo-32-caracteres-aqui}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# PORTA (Render usa a variável PORT, com fallback para 8001)
server.port=${PORT:8001}
server.error.include-message=always
server.error.include-binding-errors=always